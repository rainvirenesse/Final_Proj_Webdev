# Nixpacks PHP build — ensures extensions required by Symfony + MySQL + JWT
# https://nixpacks.com/docs/providers/php

[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.intl", "php82Extensions.opcache", "php82Extensions.sodium", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.curl", "php82Extensions.zip", "openssl", "nodejs", "npm"]

[phases.build]
cmds = ["bash bin/railway-build.sh"]

[start]
cmd = "bash bin/railway-start.sh"
