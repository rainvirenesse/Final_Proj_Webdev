# Railway deployment — https://docs.railway.com/reference/config-as-code
# 1. Create a project and add a MySQL database service.
# 2. Add this repo as a service; set variables from docs/RAILWAY.md (or .env.dist).
# 3. Set DATABASE_URL from the MySQL service reference variable MYSQL_URL / MYSQL_PUBLIC_URL.

[build]
# Use Dockerfile (includes PHP + Composer). Nixpacks/Railpack auto-builds often miss composer.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "bash bin/railway-start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
