services:
  mysql:
    image: mysql:8.0
    container_name: project_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - project_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: project_phpmyadmin
    restart: unless-stopped
    environment: 
      PMA_HOST: mysql
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
 
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - project_network

  realtime-ws:
    image: node:22-alpine
    container_name: project_realtime_ws
    working_dir: /app
    command: sh -c "npm install && npm start"
    volumes:
      - ./realtime-ws:/app
    ports:
      - "8091:8090"
    environment:
      PORT: "8090"
      REALTIME_WS_BROADCAST_KEY: ${REALTIME_WS_BROADCAST_KEY:-credo-dev-broadcast-key}
    networks:
      - project_network

###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure
    container_name: project_mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}'
      MERCURE_SUBSCRIBER_JWT_KEY: '${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}'
      # Browser EventSource (React localhost:3000) + Symfony admin/API origins
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins *
        anonymous
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    ports:
      - "9090:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    networks:
      - project_network
###< symfony/mercure-bundle ###

volumes:

###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
  mysql_data:

networks:
  project_network:
