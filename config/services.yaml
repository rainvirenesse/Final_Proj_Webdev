# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    user_images_directory: '%kernel.project_dir%/public/uploads/users'
    product_images_directory: '%kernel.project_dir%/public/images/products'
    env(APP_URL): 'http://127.0.0.1:8000'
    env(DEFAULT_URI): '%env(APP_URL)%'
    env(CORS_ALLOW_ORIGIN): '^https?://.*'
    env(JWT_SECRET_KEY): '%kernel.project_dir%/config/jwt/private.pem'
    env(JWT_PUBLIC_KEY): '%kernel.project_dir%/config/jwt/public.pem'
    env(JWT_PASSPHRASE): ''
    # Defaults for %env(default:...:VAR)% processors (Railway-safe when VAR is unset).
    messenger_transport_dsn_default: 'doctrine://default?queue_name=messages'
    mailer_dsn_default: 'null://null'
    google_client_id_default: ''
    google_android_client_id_default: ''
    google_client_secret_default: ''
    google_oauth_redirect_default: 'http://localhost'
    contact_form_embed_default: ''
    env(CONTACT_FORM_EMBED_URL): ''
    env(GOOGLE_CLIENT_ID): ''
    env(GOOGLE_ANDROID_CLIENT_ID): ''
    env(GOOGLE_CLIENT_SECRET): ''
    env(GOOGLE_OAUTH_REDIRECT_URI): 'http://localhost'
    app.url: '%env(APP_URL)%'

imports:
    - { resource: services_realtime.yaml }

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Controller/'

    # Controllers must be registered as services so Symfony can inject the container
    # (required for AbstractController helpers + our realtime endpoints).
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\Controller\LandingPageController:
        bind:
            $contactFormEmbedUrl: '%env(default:contact_form_embed_default:CONTACT_FORM_EMBED_URL)%'

    App\Service\ProductImageStorage:
        arguments:
            $productImagesDirectory: '%product_images_directory%'
            $projectDir: '%kernel.project_dir%'

    App\Serializer\ProductNormalizer:
        tags:
            - { name: serializer.normalizer, priority: 64 }

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
