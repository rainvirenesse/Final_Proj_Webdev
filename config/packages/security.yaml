security:
    # Admins implicitly have staff capabilities (used for shared admin routes).
    role_hierarchy:
        ROLE_ADMIN: [ROLE_STAFF, ROLE_USER]
        ROLE_STAFF: [ROLE_USER]
        ROLE_CUSTOMER: [ROLE_USER]

    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Entity\User:
            algorithm: auto
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        app_username_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/login
                username_path: email
                # password_path: password

        api_public_registration:
            pattern: ^/api/(register|verify-email)
            stateless: true
            security: false

        api_public:
            # Public mobile-consumable endpoints (catalog + onboarding).
            # Keep business/admin API routes protected by api_platform JWT firewall.
            pattern: ^/api/(register|verify-email|products|services|order_items)(?:/|\.|$)
            stateless: true
            security: false

        api_customer_catalog:
            pattern: ^/api/customer/products
            stateless: true
            security: false

        api_entrypoint_public:
            # Disabled: keep /api protected.
            pattern: ^$
            stateless: true
            security: false

        api_platform:
            pattern: ^/api
            stateless: true
            # Must match User::getUserIdentifier() (email) — JWT subject is email, not username.
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            custom_authenticators:                        
                - App\Security\GoogleAuthenticator 
            form_login:
                login_path: /login
                check_path: /login
                # default_target_path: /LandingPage
                # csrf_token_generator: security.csrf.token_manager
                success_handler: App\Security\LoginSuccessHandler
            logout:
                path: logout
                # where to redirect after logout
                target: login

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the first matching rule is applied
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/verify-email, roles: PUBLIC_ACCESS }
        - { path: ^/health, roles: PUBLIC_ACCESS }
        - { path: ^/LandingPage, roles: PUBLIC_ACCESS }
        - { path: ^/about, roles: PUBLIC_ACCESS }
        - { path: ^/contact, roles: PUBLIC_ACCESS }
        - { path: ^/shop, roles: PUBLIC_ACCESS }
        - { path: ^/auth/google, roles: PUBLIC_ACCESS }
        # Admin-only areas
        - { path: ^/admin/users, roles: ROLE_ADMIN }
        - { path: ^/admin/activity-logs, roles: ROLE_ADMIN }
        # Staff and admins (hierarchy gives ROLE_STAFF to ROLE_ADMIN)
        - { path: ^/admin/dashboard, roles: ROLE_STAFF }
        - { path: ^/admin/products, roles: ROLE_STAFF }
        - { path: ^/admin/stock, roles: ROLE_STAFF }
        - { path: ^/admin/orders, roles: ROLE_STAFF }
        - { path: ^/admin/services, roles: ROLE_STAFF }
        - { path: ^/realtime, roles: ROLE_STAFF }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/staff, roles: ROLE_STAFF }
        - { path: ^/user, roles: ROLE_USER }
        
        # - { path: ^/api$, roles: IS_AUTHENTICATED }
        - { path: ^/api/docs, roles: IS_AUTHENTICATED }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/google/mobile, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/verify-email, roles: PUBLIC_ACCESS }
        - { path: ^/api/customer/products, roles: PUBLIC_ACCESS }
        # Authenticated customers (ROLE_USER in DB + runtime ROLE_CUSTOMER). Staff/admin blocked in controllers via CustomerApiVoter.
        - { path: ^/api/(cart|orders|payments|customer), roles: ROLE_USER }
        - { path: ^/api, roles: IS_AUTHENTICATED }
        # - { path: ^/user, roles: IS_AUTHENTICATED }
        - { path: ^/activity_log, roles: IS_AUTHENTICATED }
        - { path: ^/product, roles: IS_AUTHENTICATED }
        - { path: ^/customer, roles: IS_AUTHENTICATED }
        - { path: ^/order, roles: IS_AUTHENTICATED }
       
       

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon