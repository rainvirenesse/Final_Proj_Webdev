server {
    listen 80 default_server;
    root /app/public;
    index index.php;

     # Store request and error logs for monitoring the application
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

     # Add basic security protection headers for the web application
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Deliver static assets like CSS, JavaScript, and images directly
    location ~ ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

      # Allow access to .well-known files used for verification services
    location ~ /\.well-known {
        allow all;
    }

     # Block access to hidden system files for security purposes
    location ~ /\. {
        deny all;
    }

    # Prevent access to backup or sensitive configuration files
    location ~ ~$ {
        deny all;
    }

     # Forward application requests to Symfony routing system
    location / {
        # Check if the requested file or folder exists before routing to Symfony
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Process PHP requests using PHP-FPM
    location ~ ^/index\.php {
        fastcgi_pass localhost:9000;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;

        # Pass the correct script and document root information to PHP-FPM
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Configure timeout values for longer PHP requests
        fastcgi_read_timeout 60s;
        fastcgi_connect_timeout 60s;
        
        # Restrict direct external access to internal PHP processing
        internal;
    }

    # Block execution of unauthorized PHP files outside index.php
    location ~ \.php$ {
        return 404;
    }
}